name: Deploy MeditasiKu Backend to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract V24 source
        run: |
          set -euo pipefail
          mkdir -p .v24
          tar -xJf _v24_source.tar.xz -C .v24
      - name: Install Worker dependencies
        working-directory: .v24/cloudflare-worker
        run: npm install
      - name: Resolve or create D1 database
        id: d1
        working-directory: .v24/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::Repository secret CLOUDFLARE_API_TOKEN is required.'
            exit 1
          fi
          LIST="$(npx wrangler d1 list --json)"
          DBID="$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='meditasiku-db');if(x)process.stdout.write(x.uuid||x.id||'')})")"
          if [ -z "$DBID" ]; then
            OUT="$(npx wrangler d1 create meditasiku-db 2>&1)"
            printf '%s\n' "$OUT"
            DBID="$(printf '%s' "$OUT" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}' | tail -1)"
          fi
          if [ -z "$DBID" ]; then echo '::error::Could not resolve D1 database id'; exit 1; fi
          echo "database_id=$DBID" >> "$GITHUB_OUTPUT"
      - name: Build CI Wrangler config
        working-directory: .v24/cloudflare-worker
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('wrangler.jsonc','utf8');
          s=s.replace('REPLACE_WITH_D1_DATABASE_ID',process.env.D1_DATABASE_ID);
          s=s.replace('https://YOUR-GITHUB-USERNAME.github.io','https://juldigi0107.github.io');
          fs.writeFileSync('wrangler.ci.jsonc',s);
          NODE
      - name: Apply D1 migrations
        working-directory: .v24/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply meditasiku-db --remote --config wrangler.ci.jsonc
      - name: Configure Midtrans Server Key when supplied
        working-directory: .v24/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${MIDTRANS_SERVER_KEY:-}" ]; then
            printf '%s' "$MIDTRANS_SERVER_KEY" | npx wrangler secret put MIDTRANS_SERVER_KEY --config wrangler.ci.jsonc
          else
            echo 'MIDTRANS_SERVER_KEY not set; login/content works but paid checkout remains disabled.'
          fi
      - name: Deploy Worker
        working-directory: .v24/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ci.jsonc
